{% extends "base.html" %} 
{% block content %}

<h2>Auszubildende</h2>
<div class="container-wrapper">
    <a href="{{ url_for('admin.route_azubianzeige') }}" class="btn btn-primary midi tooltip"
        data-tooltip="Zeigt alle Azubis an (inkl. Download)">
        Anzeige / Download
    </a>
    <a href="{{ url_for('admin.route_upload', action='azubis') }}" class="btn btn-primary midi tooltip"
        data-tooltip="Direkter Upload der Azubidatei">
        Upload
    </a>
</div>

<h2>Ausbilder</h2>
<div class="container-wrapper">
    <a href="{{ url_for('admin.route_ausbilderanzeige') }}" class="btn btn-primary midi tooltip"
        data-tooltip="Zeigt alle Ausbilder an (inkl. Download)">
        Anzeige / Download
    </a>
    <a href="{{ url_for('admin.route_upload', action='ausbilder') }}" class="btn btn-primary midi tooltip"
        data-tooltip="Direkter Upload der Ausbilderdatei">
        Upload
    </a>
</div>

<h2>Infodatei</h2>
<div class="container-wrapper">
    <div class="btn midi"></div>
    <a href="{{ url_for('admin.route_upload', action='info') }}" class="btn btn-primary midi tooltip"
        data-tooltip="Direkter Upload der Infodatei">
        Upload
    </a>
</div>
<hr>
<div class="container-wrapper">
    <!-- Container 1 -->
    <a href="{{ url_for('admin.route_config') }}" class="btn btn-warning midi tooltip"
        data-tooltip="Konfigurationseite (Passwort, Mailserver etc.)">
        Konfiguration
    </a>
    <a href="{{ url_for('admin.route_filehandling') }}" class="btn btn-warning midi tooltip"
        data-tooltip="Übersicht, Upload  von einzelnen Dateien aus Untis und Aktualisierung der Datenbank">
        Datei-Manager
    </a>

</div>

{% endblock %}
